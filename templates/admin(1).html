<!--
    管理员后台页面 - 员工信息管理系统
    
    功能：
    1. 添加新用户（普通用户/管理员）
    2. 查看所有用户列表
    3. 重置用户密码
    4. 删除用户
    
    访问权限：仅限管理员
    
    作者：系统管理员
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 员工信息管理系统</title>
    
    <!-- 页面样式 -->
    <style>
        /* ==================== 基础样式重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==================== 页面背景 ==================== */
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            /* 黑灰色渐变背景 */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* ==================== 主容器 ==================== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(30, 30, 40, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ==================== 页面头部 ==================== */
        .header {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #e0e0e0;
            font-size: 1.5rem;
        }

        /* 头部按钮组 */
        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* ==================== 按钮样式 ==================== */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        /* 主要按钮 - 灰紫色 */
        .btn-primary {
            background: linear-gradient(135deg, #4a4a6a 0%, #3a3a5a 100%);
            color: #e0e0e0;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a5a7a 0%, #4a4a6a 100%);
            transform: translateY(-2px);
        }

        /* 成功按钮 - 绿色 */
        .btn-success {
            background: linear-gradient(135deg, #2d5a3d 0%, #1e4a2e 100%);
            color: #e0e0e0;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #3d6a4d 0%, #2e5a3e 100%);
        }

        /* 危险按钮 - 红色 */
        .btn-danger {
            background: linear-gradient(135deg, #5a2d2d 0%, #4a1e1e 100%);
            color: #e0e0e0;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #6a3d3d 0%, #5a2e2e 100%);
        }

        /* 小尺寸按钮 */
        .btn-sm {
            padding: 8px 14px;
            font-size: 0.85rem;
        }

        /* ==================== 内容区域 ==================== */
        .content {
            padding: 30px;
        }

        /* 区域标题 */
        .section-title {
            color: #e0e0e0;
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ==================== 添加用户表单 ==================== */
        .add-user-form {
            background: rgba(50, 50, 60, 0.4);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 表单行 - 横向布局 */
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        /* 表单组 */
        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(50, 50, 60, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #5a5a7a;
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: #2d2d44;
        }

        /* 复选框组 */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 28px;  /* 与输入框对齐 */
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        /* ==================== 用户列表表格 ==================== */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(45, 45, 68, 0.8);
            color: #e0e0e0;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ccc;
        }

        tr:hover {
            background: rgba(60, 60, 80, 0.3);
        }

        /* ==================== 角色标签 ==================== */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* 管理员标签 - 金色 */
        .badge-admin {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        /* 普通用户标签 - 灰色 */
        .badge-user {
            background: rgba(108, 117, 125, 0.3);
            color: #aaa;
        }

        /* 操作按钮组 */
        .actions {
            display: flex;
            gap: 8px;
        }

        /* ==================== 消息提示 ==================== */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.2);
            color: #51cf66;
            border: 1px solid rgba(40, 167, 69, 0.3);
            display: block;
        }

        .message.error {
            background: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
            display: block;
        }

        /* ==================== 模态框（重置密码） ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(40, 40, 50, 0.98);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            color: #e0e0e0;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }

            .checkbox-group {
                padding-top: 0;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- 主容器 -->
    <div class="container">
        <!-- 页面头部 -->
        <div class="header">
            <h1>⚙️ 管理后台</h1>
            <div class="header-actions">
                <!-- 返回主页按钮 -->
                <a href="/" class="btn btn-primary">← 返回主页</a>
                <!-- 退出登录按钮 -->
                <button class="btn btn-danger" onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 消息提示框 -->
            <div id="messageBox"></div>

            <!-- 添加用户区域 -->
            <h2 class="section-title">添加新用户</h2>
            <div class="add-user-form">
                <form id="addUserForm" onsubmit="return addUser(event)">
                    <div class="form-row">
                        <!-- 用户名输入框 -->
                        <div class="form-group">
                            <label for="newUsername">用户名</label>
                            <input type="text" id="newUsername" placeholder="请输入用户名" required>
                        </div>
                        <!-- 密码输入框 -->
                        <div class="form-group">
                            <label for="newPassword">密码</label>
                            <input type="password" id="newPassword" placeholder="请输入密码（至少4位）" required>
                        </div>
                        <!-- 管理员复选框 -->
                        <div class="checkbox-group">
                            <input type="checkbox" id="isAdmin">
                            <label for="isAdmin">设为管理员</label>
                        </div>
                    </div>
                    <!-- 提交按钮 -->
                    <button type="submit" class="btn btn-success">添加用户</button>
                </form>
            </div>

            <!-- 用户列表区域 -->
            <h2 class="section-title">用户列表</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>角色</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <!-- 动态加载用户数据 -->
                        <tr><td colspan="5" style="text-align: center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 重置密码模态框 -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3 class="modal-title">重置密码</h3>
            <div class="form-group">
                <label for="resetPassword">新密码</label>
                <input type="password" id="resetPassword" placeholder="请输入新密码（至少4位）">
            </div>
            <!-- 隐藏域，存储要重置密码的用户ID -->
            <input type="hidden" id="resetUserId">
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeModal()">取消</button>
                <button class="btn btn-success" onclick="submitResetPassword()">确认重置</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 逻辑 -->
    <script>
        /**
         * 检查登录状态和管理员权限
         * 如果未登录或非管理员，跳转到登录页
         */
        async function checkLogin() {
            try {
                const response = await fetch('/api/check-login');
                const result = await response.json();
                // 未登录或非管理员则跳转
                if (!result.logged_in || !result.is_admin) {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        /**
         * 登出功能
         * 调用登出API并跳转到登录页
         */
        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            window.location.href = '/login';
        }

        /**
         * 加载用户列表
         * 从后端API获取所有用户并渲染到表格中
         */
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const result = await response.json();

                if (result.success) {
                    const tbody = document.getElementById('userList');
                    
                    // 无数据时显示提示
                    if (result.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">暂无用户</td></tr>';
                        return;
                    }

                    // 构建用户列表HTML
                    let html = '';
                    result.data.forEach(user => {
                        // 根据is_admin判断显示的标签样式和文字
                        const badgeClass = user.is_admin ? 'badge-admin' : 'badge-user';
                        const badgeText = user.is_admin ? '管理员' : '普通用户';
                        
                        html += `
                            <tr>
                                <td>${user.id}</td>
                                <td>${user.username}</td>
                                <td>
                                    <span class="badge ${badgeClass}">
                                        ${badgeText}
                                    </span>
                                </td>
                                <td>${user.created_at || '-'}</td>
                                <td class="actions">
                                    <button class="btn btn-primary btn-sm" onclick="openResetModal(${user.id})">重置密码</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id}, '${user.username}')">删除</button>
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                }
            } catch (error) {
                // 加载失败提示
                document.getElementById('userList').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ff6b6b;">加载失败</td></tr>';
            }
        }

        /**
         * 添加新用户
         * 收集表单数据并发送到后端API
         * 
         * @param {Event} event - 表单提交事件
         * @returns {boolean} - 返回false阻止默认提交
         */
        async function addUser(event) {
            event.preventDefault();

            // 收集表单数据
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const is_admin = document.getElementById('isAdmin').checked ? 1 : 0;

            // 验证输入
            if (!username || !password) {
                showMessage('用户名和密码不能为空', 'error');
                return false;
            }

            if (password.length < 4) {
                showMessage('密码至少4位', 'error');
                return false;
            }

            try {
                // 发送添加用户请求
                const response = await fetch('/api/admin/user', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, is_admin})
                });

                const result = await response.json();
                if (result.success) {
                    showMessage(result.message, 'success');
                    // 清空表单
                    document.getElementById('addUserForm').reset();
                    // 刷新用户列表
                    loadUsers();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('添加失败', 'error');
            }

            return false;
        }

        /**
         * 打开重置密码模态框
         * 
         * @param {number} userId - 要重置密码的用户ID
         */
        function openResetModal(userId) {
            // 保存用户ID到隐藏域
            document.getElementById('resetUserId').value = userId;
            // 清空密码输入框
            document.getElementById('resetPassword').value = '';
            // 显示模态框
            document.getElementById('passwordModal').classList.add('active');
        }

        /**
         * 关闭模态框
         */
        function closeModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        /**
         * 提交重置密码请求
         */
        async function submitResetPassword() {
            const userId = document.getElementById('resetUserId').value;
            const password = document.getElementById('resetPassword').value;

            // 验证密码
            if (!password || password.length < 4) {
                showMessage('密码至少4位', 'error');
                return;
            }

            try {
                // 发送重置密码请求
                const response = await fetch(`/api/admin/user/${userId}/password`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password})
                });

                const result = await response.json();
                if (result.success) {
                    showMessage(result.message, 'success');
                    closeModal();  // 关闭模态框
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('重置失败', 'error');
            }
        }

        /**
         * 删除用户
         * 
         * @param {number} userId - 要删除的用户ID
         * @param {string} username - 用户名（用于确认提示）
         */
        async function deleteUser(userId, username) {
            // 确认删除
            if (!confirm(`确定要删除用户 "${username}" 吗？`)) {
                return;
            }

            try {
                // 发送删除请求
                const response = await fetch(`/api/admin/user/${userId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showMessage(result.message, 'success');
                    loadUsers();  // 刷新用户列表
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('删除失败', 'error');
            }
        }

        /**
         * 显示消息提示
         * 3秒后自动隐藏
         * 
         * @param {string} text - 消息文本
         * @param {string} type - 消息类型：'error' 或 'success'
         */
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message ' + type;
            // 3秒后自动隐藏
            setTimeout(() => { box.className = 'message'; }, 3000);
        }

        // 页面加载完成后执行
        checkLogin();   // 检查登录状态
        loadUsers();    // 加载用户列表
    </script>
</body>
</html>
