<!-- ===== AI 聊天助手组件 ===== -->
<style>
    /* 聊天入口按钮 */
    .chat-fab {
        position: fixed; bottom: 24px; right: 24px; z-index: 9999;
        width: 56px; height: 56px; border-radius: 50%;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: #fff; border: none; cursor: pointer;
        box-shadow: 0 4px 20px rgba(79,70,229,0.35);
        display: flex; align-items: center; justify-content: center;
        transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        font-size: 24px;
    }
    .chat-fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(79,70,229,0.45); }
    .chat-fab.open { transform: rotate(90deg) scale(0.9); opacity: 0.6; }
    .chat-fab .fab-icon { pointer-events: none; }

    /* 聊天窗口 */
    .chat-window {
        position: fixed; bottom: 92px; right: 24px; z-index: 9998;
        width: 400px; height: 560px;
        background: #fff; border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
        display: none; flex-direction: column; overflow: hidden;
        animation: chatSlideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .chat-window.open { display: flex; }
    @keyframes chatSlideUp {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 聊天头部 */
    .chat-header {
        padding: 16px 20px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: #fff; display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .chat-avatar {
        width: 36px; height: 36px; background: rgba(255,255,255,0.2);
        border-radius: 10px; display: flex; align-items: center; justify-content: center;
        font-size: 18px;
    }
    .chat-title { font-weight: 600; font-size: 0.9375rem; }
    .chat-subtitle { font-size: 0.75rem; opacity: 0.8; }
    .chat-header-actions { display: flex; gap: 4px; }
    .chat-header-btn {
        width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.15);
        border-radius: 8px; color: #fff; cursor: pointer; font-size: 14px;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.15s;
    }
    .chat-header-btn:hover { background: rgba(255,255,255,0.25); }

    /* 消息区域 */
    .chat-messages {
        flex: 1; overflow-y: auto; padding: 16px;
        background: #f8fafc; display: flex; flex-direction: column; gap: 12px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

    /* 消息气泡 */
    .chat-msg { display: flex; gap: 8px; max-width: 90%; animation: msgFade 0.2s ease; }
    @keyframes msgFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .chat-msg-avatar {
        width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .chat-msg.bot .chat-msg-avatar { background: #ede9fe; color: #7c3aed; }
    .chat-msg.user .chat-msg-avatar { background: #dbeafe; color: #3b82f6; }
    .chat-msg-bubble {
        padding: 10px 14px; border-radius: 12px; font-size: 0.875rem;
        line-height: 1.6; word-break: break-word;
    }
    .chat-msg.bot .chat-msg-bubble { background: #fff; color: #0f172a; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
    .chat-msg.user .chat-msg-bubble { background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }

    /* 打字指示器 */
    .chat-typing { display: none; align-self: flex-start; padding: 8px 14px; }
    .chat-typing.show { display: flex; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
        width: 6px; height: 6px; background: #a5b4fc; border-radius: 50%;
        animation: typingBounce 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
    }

    /* 输入区域 */
    .chat-input-area {
        padding: 12px 16px; border-top: 1px solid #e2e8f0;
        display: flex; gap: 8px; align-items: flex-end; background: #fff;
    }
    .chat-input {
        flex: 1; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
        font-size: 0.875rem; resize: none; outline: none;
        font-family: inherit; line-height: 1.5; max-height: 100px;
        transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: #4f46e5; }
    .chat-send-btn {
        width: 40px; height: 40px; border: none; border-radius: 10px;
        background: #4f46e5; color: #fff; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.15s; flex-shrink: 0;
    }
    .chat-send-btn:hover { background: #4338ca; }
    .chat-send-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .chat-send-btn svg { width: 18px; height: 18px; }

    /* 快捷操作 */
    .chat-quick-actions {
        padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap;
        border-top: 1px solid #f1f5f9; background: #fff;
    }
    .chat-quick-btn {
        padding: 5px 12px; border: 1px solid #e2e8f0; border-radius: 16px;
        background: #f8fafc; color: #475569; font-size: 0.75rem;
        cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .chat-quick-btn:hover { border-color: #4f46e5; color: #4f46e5; background: #eef2ff; }

    /* 响应式 */
    @media (max-width: 480px) {
        .chat-window { bottom: 0; right: 0; width: 100%; height: 100%; border-radius: 0; }
    }
</style>

<!-- FAB 按钮 -->
<button class="chat-fab" onclick="toggleChat()" title="AI 助手">
    <span class="fab-icon">🤖</span>
</button>

<!-- 聊天窗口 -->
<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-avatar">🤖</div>
            <div>
                <div class="chat-title">AI 助手</div>
                <div class="chat-subtitle">自然语言操作员工数据</div>
            </div>
        </div>
        <div class="chat-header-actions">
            <button class="chat-header-btn" onclick="clearChat()" title="清空对话">🗑️</button>
            <button class="chat-header-btn" onclick="toggleChat()" title="关闭">✕</button>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg bot">
            <div class="chat-msg-avatar">🤖</div>
            <div class="chat-msg-bubble">
                你好！我是 AI 助手，可以帮你：<br>
                • 查询、添加、修改、删除员工<br>
                • 批量导出员工信息<br>
                • 创建数据库备份<br>
                • 查看操作日志<br><br>
                直接用自然语言告诉我你想做什么 👇
            </div>
        </div>
    </div>

    <div class="chat-typing" id="chatTyping">
        <div class="chat-msg-avatar" style="background:#ede9fe;color:#7c3aed;">🤖</div>
        <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="chat-quick-actions">
        <button class="chat-quick-btn" onclick="quickSend('查看所有员工')">📋 员工列表</button>
        <button class="chat-quick-btn" onclick="quickSend('统计一下在职和删除的员工数量')">📊 数据统计</button>
        <button class="chat-quick-btn" onclick="quickSend('创建一个数据库备份')">💾 备份</button>
        <button class="chat-quick-btn" onclick="quickSend('查看今天的操作日志')">📝 日志</button>
    </div>

    <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="输入消息，如：帮我查一下张三的信息" rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
    // ===== 聊天状态 =====
    let chatOpen = false;
    let chatSending = false;

    function toggleChat() {
        chatOpen = !chatOpen;
        document.getElementById('chatWindow').classList.toggle('open', chatOpen);
        document.querySelector('.chat-fab').classList.toggle('open', chatOpen);
        if (chatOpen) {
            document.getElementById('chatInput').focus();
            scrollChat();
        }
    }

    function scrollChat() {
        const el = document.getElementById('chatMessages');
        setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
    }

    function addMessage(role, text) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        const avatar = role === 'bot' ? '🤖' : '👤';
        div.innerHTML = '<div class="chat-msg-avatar">' + avatar + '</div><div class="chat-msg-bubble">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>';
        container.appendChild(div);
        scrollChat();
        return div;
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function setTyping(show) {
        document.getElementById('chatTyping').classList.toggle('show', show);
        if (show) scrollChat();
    }

    function quickSend(text) {
        document.getElementById('chatInput').value = text;
        sendMessage();
    }

    async function sendMessage() {
        if (chatSending) return;
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        input.style.height = 'auto';
        addMessage('user', text);

        chatSending = true;
        document.getElementById('chatSendBtn').disabled = true;
        setTyping(true);

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await resp.json();
            setTyping(false);

            if (data.success) {
                addMessage('bot', data.reply);
            } else {
                addMessage('bot', '❌ ' + (data.message || '请求失败'));
            }
        } catch (e) {
            setTyping(false);
            addMessage('bot', '❌ 网络错误，请检查服务是否运行中');
        }

        chatSending = false;
        document.getElementById('chatSendBtn').disabled = false;
        input.focus();
    }

    async function clearChat() {
        try {
            await fetch('/api/chat/clear', { method: 'POST' });
        } catch (e) {}
        const container = document.getElementById('chatMessages');
        container.innerHTML = '<div class="chat-msg bot"><div class="chat-msg-avatar">🤖</div><div class="chat-msg-bubble">对话已重置，有什么可以帮你的？</div></div>';
    }

    // 输入框自动增高
    document.getElementById('chatInput').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
</script>
