<!--
    登录页面 - 员工信息管理系统
    
    功能：
    1. 用户名密码登录
    2. 黑灰色风格界面设计
    3. 登录状态提示
    4. 响应式布局，支持移动端
    
    作者：系统管理员
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 员工信息管理系统</title>
    
    <!-- 页面样式 -->
    <style>
        /* ==================== 基础样式重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==================== 页面背景 ==================== */
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            /* 黑灰色渐变背景 */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            /* 垂直水平居中 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ==================== 登录容器 ==================== */
        .login-container {
            width: 100%;
            max-width: 420px;
            /* 半透明深色背景 */
            background: rgba(30, 30, 40, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            /* 边框装饰 */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ==================== 登录头部 ==================== */
        .login-header {
            /* 深色渐变背景 */
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            padding: 40px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 锁图标 */
        .login-header .icon {
            font-size: 48px;
            margin-bottom: 15px;
            /* 略微降低饱和度 */
            filter: grayscale(30%);
        }

        /* 标题样式 */
        .login-header h1 {
            color: #e0e0e0;
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* 副标题样式 */
        .login-header p {
            color: #888;
            font-size: 0.9rem;
        }

        /* ==================== 表单区域 ==================== */
        .login-form {
            padding: 40px 30px;
        }

        /* 表单组 - 每个输入框 */
        .form-group {
            margin-bottom: 25px;
        }

        /* 标签样式 */
        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* 输入框样式 */
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            /* 深色半透明背景 */
            background: rgba(50, 50, 60, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        /* 输入框占位符颜色 */
        .form-group input::placeholder {
            color: #666;
        }

        /* 输入框聚焦状态 */
        .form-group input:focus {
            outline: none;
            border-color: #5a5a7a;
            background: rgba(60, 60, 70, 0.8);
            box-shadow: 0 0 0 4px rgba(90, 90, 122, 0.1);
        }

        /* ==================== 登录按钮 ==================== */
        .btn-login {
            width: 100%;
            padding: 16px;
            /* 灰紫色渐变背景 */
            background: linear-gradient(135deg, #4a4a6a 0%, #3a3a5a 100%);
            border: none;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        /* 按钮悬停效果 */
        .btn-login:hover {
            background: linear-gradient(135deg, #5a5a7a 0%, #4a4a6a 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* 按钮点击效果 */
        .btn-login:active {
            transform: translateY(0);
        }

        /* 按钮禁用状态 */
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ==================== 消息提示 ==================== */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            display: none;  /* 默认隐藏 */
        }

        /* 错误消息样式 */
        .message.error {
            background: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
            display: block;
        }

        /* 成功消息样式 */
        .message.success {
            background: rgba(40, 167, 69, 0.2);
            color: #51cf66;
            border: 1px solid rgba(40, 167, 69, 0.3);
            display: block;
        }

        /* ==================== 底部提示 ==================== */
        .login-footer {
            text-align: center;
            padding: 20px 30px;
            background: rgba(20, 20, 30, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-footer p {
            color: #555;
            font-size: 0.85rem;
        }

        /* ==================== 加载动画 ==================== */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* 旋转动画关键帧 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-form {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 登录容器 -->
    <div class="login-container">
        <!-- 头部：图标和标题 -->
        <div class="login-header">
            <div class="icon">🔐</div>
            <h1>员工信息管理系统</h1>
            <p>请登录以继续使用系统</p>
        </div>

        <!-- 登录表单 -->
        <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">
            <!-- 消息提示框 -->
            <div id="messageBox" class="message"></div>

            <!-- 用户名输入 -->
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" 
                       placeholder="请输入用户名" required 
                       autocomplete="username">
            </div>

            <!-- 密码输入 -->
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" 
                       placeholder="请输入密码" required 
                       autocomplete="current-password">
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn-login" id="loginBtn">登 录</button>
        </form>

        <!-- 底部提示 -->
        <div class="login-footer">
            <p>仅限授权用户访问 · 联系管理员获取账户</p>
        </div>
    </div>

    <!-- JavaScript 逻辑 -->
    <script>
        /**
         * 处理登录表单提交
         * 
         * 流程：
         * 1. 阻止表单默认提交
         * 2. 验证输入
         * 3. 发送登录请求到后端API
         * 4. 根据结果跳转或显示错误
         * 
         * @param {Event} event - 表单提交事件
         * @returns {boolean} - 返回false阻止默认提交
         */
        async function handleLogin(event) {
            event.preventDefault();  // 阻止表单默认提交行为

            // 获取表单元素
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const messageBox = document.getElementById('messageBox');
            const loginBtn = document.getElementById('loginBtn');

            // 验证：用户名和密码不能为空
            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error');
                return false;
            }

            // 禁用按钮，显示加载状态
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>登录中...';

            try {
                // 发送POST请求到登录API
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                // 解析响应
                const result = await response.json();

                if (result.success) {
                    // 登录成功
                    showMessage('登录成功，正在跳转...', 'success');
                    // 延迟跳转，让用户看到成功提示
                    setTimeout(() => {
                        window.location.href = '/';  // 跳转到主页
                    }, 500);
                } else {
                    // 登录失败，显示错误消息
                    showMessage(result.message || '登录失败', 'error');
                    // 恢复按钮状态
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登 录';
                }
            } catch (error) {
                // 网络错误或其他异常
                showMessage('网络错误，请重试', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登 录';
            }

            return false;  // 阻止表单提交
        }

        /**
         * 显示消息提示
         * 
         * @param {string} text - 消息文本
         * @param {string} type - 消息类型：'error' 或 'success'
         */
        function showMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = 'message ' + type;
        }

        // 监听密码框回车键，触发表单提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(event);
            }
        });
    </script>
</body>
</html>
